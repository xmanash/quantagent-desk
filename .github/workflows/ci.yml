name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    env:
      QUANTAGENT_DISABLE_LLM: "1"
      QUANTAGENT_RAGAS_LEXICAL: "1"
      QUANTAGENT_SKIP_EMBEDDINGS: "1"
      QUANTAGENT_MARKET_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyyaml
      - name: Unit tests
        run: PYTHONPATH=src pytest tests/ -v -m "not eval"
      - name: RAGAS and accuracy eval suite
        run: PYTHONPATH=src python scripts/run_evals.py
      - name: Sample data loader
        run: PYTHONPATH=src python scripts/load_sample_data.py
